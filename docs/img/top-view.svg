<line x1="211.2" y1="179.0" x2="264.8" y2="179.0" stroke="#ffffff" stroke-width="2"/>
<line x1="653.8" y1="179.0" x2="707.5" y2="179.0" stroke="#ffffff" stroke-width="2"/>
<rect x="235.5" y="146.5" width="5" height="7.0" fill="#6b4a26"/>
