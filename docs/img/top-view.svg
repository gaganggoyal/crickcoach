<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 512" width="784" height="512" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Where the two cameras go, seen from above</title>
<desc id="desc">The side-on camera stands 12 m from the line between the middle stumps, level with the middle of the pitch, looking square across it. The camera behind the bowler is 8 m behind the bowler's stumps, over the line of middle stump, looking down the pitch.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5a45"/></marker></defs>
<rect width="784" height="512" rx="16" fill="#eef3e8"/>
<text x="24.0" y="32.0" font-size="15" fill="#1f2a1a" text-anchor="start" font-weight="600">Seen from above</text>
<text x="24.0" y="50.0" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">to scale; grid lines every 5 m</text>
<line x1="128.0" y1="70" x2="128.0" y2="496" stroke="#dbe5d2" stroke-width="1"/>
<line x1="238.0" y1="70" x2="238.0" y2="496" stroke="#dbe5d2" stroke-width="1"/>
<line x1="348.0" y1="70" x2="348.0" y2="496" stroke="#dbe5d2" stroke-width="1"/>
