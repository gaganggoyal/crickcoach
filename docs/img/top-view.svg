<text x="238.0" y="95.0" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">Bowler's stumps</text>
<text x="680.6" y="95.0" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">Batter's stumps</text>
<line x1="238.0" y1="75.2" x2="680.6" y2="75.2" stroke="#4d5a45" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="459.3" y="69.2" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">20.12 m between the stumps</text>
<line x1="48.8" y1="166.5" x2="216.0" y2="166.5" stroke="#4d5a45" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#a)"/>
