<text x="24.0" y="268.2" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">8 m behind the stumps,</text>
<text x="24.0" y="283.2" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">6 m up, over the line</text>
<text x="24.0" y="298.2" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">of middle stump</text>
<line x1="62.0" y1="207.2" x2="238.0" y2="207.2" stroke="#4d5a45" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="150.0" y="223.2" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">8 m</text>
<rect x="451.3" y="407.0" width="16" height="20" rx="3" fill="#2f6fb2"/><path d="M454.3,407.0 L450.3,399.0 L468.3,399.0 L464.3,407.0 z" fill="#2f6fb2"/>
<line x1="489.3" y1="187.4" x2="489.3" y2="406.0" stroke="#4d5a45" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="497.3" y="308.4" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">12 m (10 to 15 m)</text>
<text x="497.3" y="323.4" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">from the stump line</text>
<text x="459.3" y="444.0" font-size="13" fill="#2f6fb2" text-anchor="middle" font-weight="600">Side-on camera</text>
<text x="459.3" y="461.0" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">level with the middle of the pitch, 2 to 3 m up,</text>
<text x="459.3" y="476.0" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">both sets of stumps in view with 1.5 m to spare</text>
