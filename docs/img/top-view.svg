<path d="M77.0,150.0 L717.6,92.8 L717.6,207.2 z" fill="#c9561f" fill-opacity="0.13" stroke="#c9561f" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M273.2,108.2 H730.8 V191.8 H273.2" fill="none" stroke="#6f8266" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="735.2" y="103.8" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">netting</text>
