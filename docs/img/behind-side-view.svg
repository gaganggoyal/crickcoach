<line x1="710.6" y1="300.0" x2="710.6" y2="284.4" stroke="#6b4a26" stroke-width="3"/>
<circle cx="284.5" cy="263.0" r="2.9" fill="#1f2a1a"/>
<line x1="283.4" y1="266.6" x2="280.1" y2="279.1" stroke="#1f2a1a" stroke-width="3" stroke-linecap="round"/>
<line x1="280.1" y1="279.1" x2="271.3" y2="300.0" stroke="#1f2a1a" stroke-width="3" stroke-linecap="round"/>
<line x1="280.1" y1="279.1" x2="293.3" y2="300.0" stroke="#1f2a1a" stroke-width="3" stroke-linecap="round"/>
<line x1="283.0" y1="268.1" x2="289.6" y2="253.4" stroke="#1f2a1a" stroke-width="3" stroke-linecap="round"/>
<line x1="283.0" y1="268.1" x2="273.5" y2="276.9" stroke="#1f2a1a" stroke-width="3" stroke-linecap="round"/>
<path d="M290.0,252.7 Q435.2,268.1 556.2,300.0 Q633.2,278.0 710.6,286.4" fill="none" stroke="#b8322a" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="556.2" cy="300.0" r="4" fill="#b8322a"/>
<text x="556.2" y="336.0" font-size="12" fill="#4d5a45" text-anchor="middle" font-weight="400">a good length: pitches 7 m from the batter</text>
<line x1="102.0" y1="168.0" x2="367.0" y2="272.5" stroke="#1f2a1a" stroke-width="1.2" stroke-dasharray="2 3"/>
<circle cx="367.0" cy="272.5" r="3.5" fill="#b8322a"/>
<text x="303.2" y="226.3" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">the view to a short ball</text>
<text x="303.2" y="241.3" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">clears the bowler's head</text>
