<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 392" width="784" height="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The camera behind the bowler, seen from the side</title>
<desc id="desc">The camera is 6 m up and 8 m behind the bowler's stumps. Its view runs from the near popping crease at the bottom of the picture to the far stumps near the top, and the line of sight to a short ball passes over the bowler's head.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5a45"/></marker></defs>
<rect width="784" height="392" rx="16" fill="#eef3e8"/>
<text x="24.0" y="32.0" font-size="15" fill="#1f2a1a" text-anchor="start" font-weight="600">The camera behind the bowler, seen from the side</text>
<text x="24.0" y="50.0" font-size="12" fill="#4d5a45" text-anchor="start" font-weight="400">to scale</text>
<path d="M102.0,168.0 L294.8,300.0 L774.0,300.0 L774.0,296.3 z" fill="#c9561f" fill-opacity="0.12" stroke="#c9561f" stroke-opacity="0.55" stroke-width="1.2"/>
<line x1="70.0" y1="300.0" x2="774.0" y2="300.0" stroke="#8a9a80" stroke-width="2"/>
